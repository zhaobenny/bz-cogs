# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.7
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        stages: [pre-push]
      # Run the formatter.
      - id: ruff-format
        stages: [pre-push]

  - repo: local
    hooks:
      - id: check-aiuser-version
        name: Check aiuser __version__ updated
        entry: bash -c 'if [ "$(git branch --show-current)" != "main" ]; then exit 0; fi; uv run .githooks/check_version_update.py'
        language: system
        files: ^aiuser/
        pass_filenames: false
        stages: [pre-push]
