name: "Ruff Lint/Formatting"

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run Ruff check
        run: uvx --from ruff==0.16.6 ruff check . --target-version py39

      - name: Run Ruff format check
        run: uvx --from ruff==0.16.6 ruff format --check .
