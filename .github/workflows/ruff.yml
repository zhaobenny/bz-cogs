name: "Ruff Lint/Formatting"

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Run Ruff check
        run: uvx --from ruff==0.15.7 ruff check .

      - name: Run Ruff format check
        run: uvx --from ruff==0.15.7 ruff format --check .
